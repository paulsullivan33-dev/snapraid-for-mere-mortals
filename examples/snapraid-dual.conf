# SnapRAID example config: two data disks, TWO parity levels.
# Add the 2-parity line to a running array only by the procedure
# in chapter 8 (a plain sync refuses; initialise or --force-full sync).

parity /mnt/parity/snapraid.parity
2-parity /mnt/parity2/snapraid.parity

content /mnt/disk1/snapraid.content
content /mnt/disk2/snapraid.content

data d1 /mnt/disk1/
data d2 /mnt/disk2/

exclude /snapraid.content
exclude /snapraid.parity
