# SnapRAID example config: two data disks, one parity.
# The lab's config used sandbox paths; the shape is identical.
# See chapter 4 (writing-the-config.md) for line-by-line notes.

parity /mnt/parity/snapraid.parity

content /mnt/disk1/snapraid.content
content /mnt/disk2/snapraid.content

data d1 /mnt/disk1/
data d2 /mnt/disk2/

# Keep SnapRAID's own files out of the array.
exclude /snapraid.content
exclude /snapraid.parity

# Common addition: scratch space that should not be protected.
# exclude /incoming/
