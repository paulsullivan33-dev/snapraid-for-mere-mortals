site_name: SnapRAID for Mere Mortals
site_description: Plain-language disk protection for arrays of big, rarely changing files. Parity explained without the RAID folklore, a config you write yourself, sync and scrub as habits, and recovery rehearsed on a real array before you need it.
site_url: https://paulsullivan33-dev.github.io/snapraid-for-mere-mortals/
